<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Health Dashboard - AI Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .input-field { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.2); transition: border-color 0.2s, box-shadow 0.2s; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); outline: none; }
        .card { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    
    <div id="main-container" class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
        <!-- Form Section -->
        <div class="glass-panel p-8 rounded-2xl shadow-2xl card" id="form-card">
            <h2 class="text-3xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">Soil Parameters</h2>
            
            <form id="prediction-form" class="space-y-5">
                <div class="relative group">
                    <label class="block text-sm font-medium text-slate-300 mb-1 transition-colors group-hover:text-white">pH Level (0-14)</label>
                    <input type="number" id="ph" step="0.1" value="6.5" class="input-field w-full px-4 py-3 rounded-lg text-white" required>
                </div>
                
                <div class="relative group">
                    <label class="block text-sm font-medium text-slate-300 mb-1 transition-colors group-hover:text-white">Moisture (%)</label>
                    <input type="number" id="moisture" value="50" class="input-field w-full px-4 py-3 rounded-lg text-white" required>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div class="relative group">
                        <label class="block text-sm font-medium text-slate-300 mb-1 transition-colors group-hover:text-white">Nitrogen (N)</label>
                        <input type="number" id="n" value="40" class="input-field w-full px-4 py-3 rounded-lg text-white" required>
                    </div>
                    <div class="relative group">
                        <label class="block text-sm font-medium text-slate-300 mb-1 transition-colors group-hover:text-white">Phosphorus (P)</label>
                        <input type="number" id="p" value="30" class="input-field w-full px-4 py-3 rounded-lg text-white" required>
                    </div>
                    <div class="relative group">
                        <label class="block text-sm font-medium text-slate-300 mb-1 transition-colors group-hover:text-white">Potassium (K)</label>
                        <input type="number" id="k" value="30" class="input-field w-full px-4 py-3 rounded-lg text-white" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full mt-6 bg-gradient-to-r from-green-500 to-blue-600 hover:from-green-400 hover:to-blue-500 text-white font-bold py-3 px-6 rounded-lg transition-transform transform focus:outline-none shadow-lg">
                    Analyze Soil Quality
                </button>
            </form>
        </div>

        <!-- Result Section -->
        <div class="glass-panel p-8 rounded-2xl shadow-2xl flex flex-col justify-center items-center text-center card relative overflow-hidden" id="result-card">
            <div id="loading" class="hidden absolute inset-0 bg-slate-900/80 flex items-center justify-center z-20 backdrop-blur-sm">
                <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            
            <h3 class="text-xl text-slate-400 font-medium mb-2">AI Prediction Result</h3>
            <div id="score-ring" class="w-48 h-48 rounded-full border-8 border-slate-700 flex items-center justify-center my-6 relative transition-colors duration-700">
                <span id="result-status" class="text-4xl font-bold tracking-wider">---</span>
            </div>
            
            <p id="result-message" class="text-slate-300 max-w-xs mt-4">
                Enter your soil metrics and click analyze to see the AI's health assessment.
            </p>
        </div>
    </div>

    <!-- Simple Animations -->
    <script>
        // Initial entry animation
        document.addEventListener("DOMContentLoaded", () => {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 + (index * 200));
            });
        });

        // Input interactions
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'scale(1.02)';
                input.parentElement.style.transition = 'transform 0.2s';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'scale(1)';
            });
        });

        // Form submission
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = 'scale(1)', 150);
            
            document.getElementById('loading').classList.remove('hidden');
            
            const data = {
                ph: parseFloat(document.getElementById('ph').value),
                moisture: parseFloat(document.getElementById('moisture').value),
                n: parseFloat(document.getElementById('n').value),
                p: parseFloat(document.getElementById('p').value),
                k: parseFloat(document.getElementById('k').value)
            };

            try {
                // Call actual Java Spring Boot API (Relative URL for deployment)
                const response = await fetch('/api/soil/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) throw new Error("API Error");
                const result = await response.json();
                
                const status = result.status.toUpperCase();
                updateResultUI(status);
            } catch (err) {
                console.error(err);
                document.getElementById('result-message').innerText = "Failed to connect to backend API on port 8080.";
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });

        function updateResultUI(status) {
            const ring = document.getElementById('score-ring');
            const statusText = document.getElementById('result-status');
            const msg = document.getElementById('result-message');
            
            // Pop out animation
            ring.style.transform = 'scale(1.1)';
            setTimeout(() => ring.style.transform = 'scale(1)', 300);

            statusText.innerText = status;
            
            if(status === 'GOOD') {
                ring.style.borderColor = '#22c55e'; // green
                statusText.style.color = '#22c55e';
                msg.innerText = "Excellent soil condition! Nutrient and pH levels are optimal for high crop yield.";
            } else if (status === 'AVERAGE') {
                ring.style.borderColor = '#eab308'; // yellow
                statusText.style.color = '#eab308';
                msg.innerText = "Acceptable soil health. Consider mild fertilizer adjustments to optimize NPK.";
            } else {
                ring.style.borderColor = '#ef4444'; // red
                statusText.style.color = '#ef4444';
                msg.innerText = "Poor soil quality detected. Immediate remediation required for pH or moisture.";
            }
        }
    </script>
</body>
</html>
